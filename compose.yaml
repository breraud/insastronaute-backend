name: insastronaute-local
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: insastronaute
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-insastronaute}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-local-database-password}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
      KC_HOSTNAME: http://localhost:18080
    ports: ["127.0.0.1:18080:8080"]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/insastronaute-realm.json:/opt/keycloak/data/import/insastronaute-realm.json:ro
  s3:
    image: chrislusf/seaweedfs:4.53
    command: [mini, -dir=/data]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-local-access-key}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-secret-key}
    ports: ["127.0.0.1:18333:8333"]
    volumes: ["s3-data:/data"]
volumes:
  postgres-data:
  keycloak-data:
  s3-data:
