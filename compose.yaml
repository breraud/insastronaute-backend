services:
  app:
    image: insastronaute-backend:latest
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insastronaute-webapi
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Le schema de l'API, ouvert ici et ferme en production : c'est l'environnement de
      # test qui sert a l'explorer.
      - 'SPRINGDOC_ENABLED=${SPRINGDOC_ENABLED:-true}'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/insastronaute'
      - 'SPRING_DATASOURCE_USERNAME=${DB_NAME}'
      - 'SPRING_DATASOURCE_PASSWORD=${DB_PSSWD}'
      - 'SPRING_DATA_REDIS_HOST=redis'
      - 'SPRING_DATA_REDIS_PORT=6379'
      - 'KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}'
      - 'SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=${KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8081/realms/inte}'
      - 'APP_SECURITY_FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-}'
      - 'DOMAIN=${DOMAIN:-}'
      - 'APP_SECURITY_ALLOWED_SUBDOMAINS=${APP_SECURITY_ALLOWED_SUBDOMAINS:-}'
      - 'APP_STS_DEBUG_COMBAT_ENABLED=${APP_STS_DEBUG_COMBAT_ENABLED:-true}'
      - 'APP_STS_PVP_ENABLED=${APP_STS_PVP_ENABLED:-false}'
      - 'APP_PUSH_ENABLED=${APP_PUSH_ENABLED:-false}'
      - 'APP_PUSH_SUBJECT=${APP_PUSH_SUBJECT:-}'
      - 'APP_PUSH_VAPID_PUBLIC_KEY=${APP_PUSH_VAPID_PUBLIC_KEY:-}'
      - 'APP_PUSH_VAPID_PRIVATE_KEY=${APP_PUSH_VAPID_PRIVATE_KEY:-}'
      - 'S3_ENDPOINT=${S3_ENDPOINT:-}'
      - 'S3_ACCESS_KEY=${S3_ACCESS_KEY:-}'
      - 'S3_SECRET_KEY=${S3_SECRET_KEY:-}'
      - 'S3_REGION=${S3_REGION:-eu-fr}'
      - 'S3_BUCKET=${S3_BUCKET:-insastronaute-proofs}'
    ports:
      - '3457:3457'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  postgres:
    image: 'postgres:17'
    container_name: insastronaute-app-db
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=insastronaute'
      - 'POSTGRES_PASSWORD=${DB_PSSWD}'
      - 'POSTGRES_USER=${DB_NAME}'
    ports:
      - '5433:5432'
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 'redis:8-alpine'
    container_name: insastronaute-app-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app-db-data:
