plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
    id 'org.cyclonedx.bom' version '3.3.0'
}

group = 'fr.insastronaute'
version = '0.0.1-SNAPSHOT'
description = 'webAPI'

ext['tomcat.version'] = '11.0.25'
ext['jackson-2-bom.version'] = '2.21.7'
ext['jackson-bom.version'] = '3.1.7'
ext['netty.version'] = '4.2.17.Final'
ext['postgresql.version'] = '42.7.12'
ext['log4j2.version'] = '2.25.5'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Le registre, pas le serveur : il rend lisibles les mesures que Micrometer
    // enregistrait jusqu'ici dans un registre en mémoire que rien n'exposait.
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.session:spring-session-data-redis'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.tika:tika-core:3.2.3'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.jsoup:jsoup:1.23.1'
    implementation 'net.coobird:thumbnailator:0.4.20'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation platform('software.amazon.awssdk:bom:2.25.70')
    implementation 'software.amazon.awssdk:s3'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    developmentOnly 'com.h2database:h2'
    implementation 'com.interaso:webpush:1.2.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'com.google.zxing:javase:3.5.3'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApi {
    outputDir.set(file('docs/openapi'))
    groupedApiMappings.set([
            'http://localhost:8082/v3/api-docs/app'       : 'app.json',
            'http://localhost:8082/v3/api-docs/admin'     : 'admin.json',
            'http://localhost:8082/v3/api-docs/moderation': 'moderation.json'
    ])
    waitTimeInSeconds.set(60)
    customBootRun {
        args.set(['--spring.profiles.active=openapi'])
    }
}

tasks.named('generateOpenApiDocs') {
    notCompatibleWithConfigurationCache('The Springdoc plugin starts and stops a forked Spring Boot process.')
}

// Genere la paire de cles VAPID du push web. A lancer une seule fois : changer la cle
// publique invalide d'un coup tous les abonnements existants.
tasks.register('vapidKeys', JavaExec) {
    group = 'application'
    description = 'Genere une paire de cles VAPID a coller dans le .env du serveur'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.insastronaute.webapi.push.VapidKeyGenerator'
}

tasks.named('test') {
    useJUnitPlatform()
    maxHeapSize = '2g'
    // Without this, a CI failure only says "there were failing tests" and the HTML report it
    // points at stays on the runner.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
    }
}

tasks.named('cyclonedxBom') {
    projectType = 'application'
    jsonOutput.set(file('build/reports/cyclonedx/bom.cdx.json'))
}

tasks.named('cyclonedxDirectBom') {
    includeConfigs = ['runtimeClasspath']
}
