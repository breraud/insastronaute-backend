server.port=8082
spring.docker.compose.enabled=false

spring.datasource.url=jdbc:h2:mem:webapi-openapi;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

spring.session.store-type=none

# Ce profil existe pour produire la spec : sans cela il la fermerait comme le defaut.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.security.openapi-docs-public=true
app.proofs.cleanup.enabled=false
app.articles.media-cleanup.enabled=false
s3.bucket-initialization-enabled=false
s3.public-bucket-initialization-enabled=false
