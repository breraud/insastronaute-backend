spring.application.name=webAPI

app.qr-link.public-url=${QR_LINK_PUBLIC_URL:https://api.example.com/q}
app.qr-link.scan-landing-url=${QR_LINK_SCAN_LANDING_URL:}
server.port=${SERVER_PORT:3457}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}
# La duree par defaut d'une session. Elle est ensuite affinee a la connexion selon le
# compte : app.security.staff-session-timeout pour le staff, player-session-timeout pour
# les joueurs. Celle-ci ne s'applique qu'aux sessions creees hors connexion.
server.servlet.session.timeout=${SERVER_SERVLET_SESSION_TIMEOUT:8h}
# Le cookie porte la plus longue des deux durees : il ne transporte qu'un identifiant, et
# un identifiant que le serveur a oublie n'authentifie rien. Le limiter a huit heures pour
# tout le monde rendrait au contraire les vingt-quatre heures des joueurs inaccessibles.
server.servlet.session.cookie.max-age=${SERVER_SERVLET_SESSION_COOKIE_MAX_AGE:24h}
server.servlet.session.cookie.http-only=${SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY:true}
server.servlet.session.cookie.secure=${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:lax}

app.security.frontend-base-url=${APP_SECURITY_FRONTEND_BASE_URL:}
app.security.domain=${DOMAIN:}
app.security.production-hardening-enabled=${APP_SECURITY_PRODUCTION_HARDENING_ENABLED:false}

spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:inte-backend}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/inte}
spring.security.oauth2.client.provider.keycloak.authorization-uri=${KEYCLOAK_AUTHORIZATION_URI:${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/auth}
spring.security.oauth2.client.provider.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/token}
spring.security.oauth2.client.provider.keycloak.user-info-uri=${KEYCLOAK_USER_INFO_URI:${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/userinfo}
spring.security.oauth2.client.provider.keycloak.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.client.provider.keycloak.issuer-uri}/protocol/openid-connect/certs}

# Par ou joindre Keycloak pour l'administration. Vide, on passe par l'emetteur public --
# donc, en production, par Cloudflare, dont le defi « managed » repond une page HTML en 403
# a un appel de serveur a serveur. Renseigner l'adresse interne du conteneur evite le
# detour, comme le fait deja KEYCLOAK_JWK_SET_URI pour les cles.
app.keycloak.admin.base-url=${KEYCLOAK_ADMIN_BASE_URL:}

app.keycloak.department-group-sync.enabled=${KEYCLOAK_DEPARTMENT_GROUP_SYNC_ENABLED:true}
app.keycloak.department-group-sync.connect-timeout=${KEYCLOAK_DEPARTMENT_GROUP_SYNC_CONNECT_TIMEOUT:5s}
app.keycloak.department-group-sync.read-timeout=${KEYCLOAK_DEPARTMENT_GROUP_SYNC_READ_TIMEOUT:20s}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/insastronaute}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dix connexions par defaut pour deux cents threads Tomcat : c'etait le plafond de
# debit reel de toutes les routes de lecture, et il ne venait d'aucune decision.
# A verifier cote serveur avant de monter : Keycloak partage l'instance, et
# max_connections vaut 100 par defaut.
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:30}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false
spring.session.store-type=${SPRING_SESSION_STORE_TYPE:redis}
spring.session.redis.namespace=${SPRING_SESSION_REDIS_NAMESPACE:insastronaute:sessions}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:128MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:136MB}
server.tomcat.max-part-count=${SERVER_TOMCAT_MAX_PART_COUNT:1000}

s3.endpoint=${S3_ENDPOINT:}
s3.public-endpoint=${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:}}
s3.access-key=${S3_ACCESS_KEY:}
s3.secret-key=${S3_SECRET_KEY:}
s3.region=${S3_REGION:eu-fr}
s3.bucket=${S3_BUCKET:insastronaute-proofs}
s3.public-bucket=${S3_PUBLIC_BUCKET:insastronaute-public}
s3.bucket-initialization-enabled=${S3_BUCKET_INITIALIZATION_ENABLED:true}
s3.bucket-cors-enabled=${S3_BUCKET_CORS_ENABLED:true}
s3.public-bucket-initialization-enabled=${S3_PUBLIC_BUCKET_INITIALIZATION_ENABLED:true}
s3.public-bucket-run-acl-hardening-enabled=${S3_PUBLIC_BUCKET_RUN_ACL_HARDENING_ENABLED:false}
s3.fail-on-policy-error=${S3_FAIL_ON_POLICY_ERROR:false}
s3.fail-on-cors-error=${S3_FAIL_ON_CORS_ERROR:false}
s3.fail-on-acl-error=${S3_FAIL_ON_ACL_ERROR:false}
# La signature doit couvrir la duree de l'envoi, pas celle d'une decision. A 300 s,
# une video de 15 Mo demandait 400 kb/s tenus pendant cinq minutes pour aboutir :
# sur le wifi d'un amphi bonde elle expirait en cours de route, et le fichier etait
# perdu sans que rien ne le rattrape. Aligne sur app.proofs.upload-timeout-minutes,
# qui est la duree pendant laquelle le backend garde la reservation ouverte.
s3.presigned-url-duration-seconds=${S3_PRESIGNED_URL_DURATION_SECONDS:900}

# Push web. Ferme par defaut : une paire de cles VAPID se genere une fois et ne change
# plus, car changer la cle publique invalide d'un coup tous les abonnements existants.
app.push.enabled=${APP_PUSH_ENABLED:false}
app.push.subject=${APP_PUSH_SUBJECT:}
app.push.vapid-public-key=${APP_PUSH_VAPID_PUBLIC_KEY:}
app.push.vapid-private-key=${APP_PUSH_VAPID_PRIVATE_KEY:}
app.push.dispatch-delay-ms=${APP_PUSH_DISPATCH_DELAY_MS:2000}
app.push.batch-size=${APP_PUSH_BATCH_SIZE:50}
app.push.max-attempts=${APP_PUSH_MAX_ATTEMPTS:5}

# Le disque des fichiers, mesure par la page Sante a cote du disque systeme. SeaweedFS
# vit sur son propre disque en production : le monter en lecture seule dans le conteneur
# et donner son chemin ici. Vide, la carte n'apparait pas.
app.health.storage-path=${APP_HEALTH_STORAGE_PATH:}

app.proofs.draft-retention-hours=${APP_PROOFS_DRAFT_RETENTION_HOURS:24}
app.proofs.upload-timeout-minutes=${APP_PROOFS_UPLOAD_TIMEOUT_MINUTES:15}
app.proofs.cleanup.enabled=${APP_PROOFS_CLEANUP_ENABLED:true}
app.proofs.cleanup-initial-delay-ms=${APP_PROOFS_CLEANUP_INITIAL_DELAY_MS:300000}
# Toutes les cinq minutes, et non toutes les heures : une reservation abandonnee
# expire au bout de app.proofs.upload-timeout-minutes, mais restait comptee dans le
# quota jusqu'au balayage suivant. Une page rechargee pendant l'envoi d'une video
# bloquait ainsi son propre renvoi pendant plus d'une heure.
app.proofs.cleanup-delay-ms=${APP_PROOFS_CLEANUP_DELAY_MS:300000}

# Le departement d'un joueur est ecrit a sa connexion, depuis son jeton : un changement
# de groupe dans Keycloak ne se voit pas tant qu'il ne revient pas. Ce balayage nocturne
# rattrape ce que personne n'a corrige a la main depuis la fiche du joueur.
app.departments.resync.enabled=${APP_DEPARTMENTS_RESYNC_ENABLED:true}
app.departments.resync-cron=${APP_DEPARTMENTS_RESYNC_CRON:0 30 4 * * *}

app.articles.media-cleanup.enabled=${APP_ARTICLES_MEDIA_CLEANUP_ENABLED:true}
app.articles.media-cleanup-cron=${APP_ARTICLES_MEDIA_CLEANUP_CRON:0 0 3 * * *}

# --- PvP raid ------------------------------------------------------------------
# Le boss de repli des raids. Les rencontres se reglent dans gameplay/pvp_raid_encounters.json
# (une liste de listes d'ennemis, une tiree au hasard par raid) ; ce boss unique ne sert que si
# ce fichier est absent ou ne nomme aucune rencontre jouable. Designe par id ou enemyName.
sts.pvp.raid.boss-enemy-id=${STS_PVP_RAID_BOSS_ENEMY_ID:Ironclad}

# Le mode PvP dans son ensemble. Eteint, ses routes n'existent plus -- ni l'appariement,
# ni les duels en cours, ni la socket de combat -- et le client cache son bouton parce que
# /api/sts/pvp/availability, qui repond toujours, lui dit que c'est ferme. Allume par defaut :
# c'est un interrupteur pour fermer le mode quand il n'est pas pret, pas une option a activer.
app.sts.pvp.enabled=${APP_STS_PVP_ENABLED:true}

# --- PvP battle timeouts -------------------------------------------------------
# A turn nobody plays is ended for its player; a player nobody has heard from for the
# grace period forfeits. Swept often enough that the wait never adds up to a whole turn.
app.sts.pvp.timeout.enabled=${APP_STS_PVP_TIMEOUT_ENABLED:true}
app.sts.pvp.timeout.sweep-initial-delay-ms=${APP_STS_PVP_TIMEOUT_SWEEP_INITIAL_DELAY_MS:30000}
app.sts.pvp.timeout.sweep-delay-ms=${APP_STS_PVP_TIMEOUT_SWEEP_DELAY_MS:10000}
app.sts.pvp.timeout.disconnect-grace-seconds=${APP_STS_PVP_TIMEOUT_DISCONNECT_GRACE_SECONDS:120}

# Hand-picked STS combats for engine testing. Rewrites the caller's own run, so keep it off
# anywhere real runs matter.
# Eteint par defaut : ce point d'entree reecrit la partie de l'appelant -- personnage,
# points de vie, ennemis, deck, reliques -- et /api/** n'exige qu'une authentification,
# donc tout joueur valide pourrait se donner la partie qu'il veut. A activer explicitement
# en developpement.
app.sts.debug.combat.enabled=${APP_STS_DEBUG_COMBAT_ENABLED:false}

app.auto-challenges.scheduler.enabled=${APP_AUTO_CHALLENGES_SCHEDULER_ENABLED:true}
app.auto-challenges.scheduler.cron=${APP_AUTO_CHALLENGES_SCHEDULER_CRON:0 0 * * * *}
app.auto-challenges.scheduler.batch-size=${APP_AUTO_CHALLENGES_SCHEDULER_BATCH_SIZE:250}
app.auto-challenges.scheduler.lock-duration=${APP_AUTO_CHALLENGES_SCHEDULER_LOCK_DURATION:PT55M}

app.game-config.object-prefix=${APP_GAME_CONFIG_OBJECT_PREFIX:GameData/current/dev/}
app.game-config.releases-object-prefix=${APP_GAME_CONFIG_RELEASES_OBJECT_PREFIX:GameData/versions/}

# Le schema de l'API et son explorateur, fermes par defaut.
#
# Ils n'etaient pas anonymes -- app.security.openapi-docs-public vaut false, donc les routes
# exigent une session -- mais n'importe quel compte connecte pouvait lire la liste exacte
# des routes et de leurs formats. En production, ce n'est pas un outil, c'est un plan.
#
# Ferme par defaut, et non ouvert : oublier d'ouvrir en test coute un outil, oublier de
# fermer en production coute le plan. Les deux oublis n'ont pas le meme prix, la valeur par
# defaut doit suivre le plus cher. Desactive, springdoc ne publie meme plus les routes :
# c'est un 404, pas un 401.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# Neuf taches @Scheduled partageaient un thread unique : le ramasse-miettes des
# medias, qui appelle S3, ou le rattrapage des succes, qui balaie les utilisateurs,
# retenaient au passage les delais de bataille PvP et l'outbox Place. Aucune ne
# partage d'etat avec une autre, donc rien ne dependait de cette serialisation.
spring.task.scheduling.pool.size=${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Observabilite.
#
# `prometheus` rend d'un coup toutes les mesures Micrometer -- jusqu'ici enregistrees
# dans un registre en memoire que rien n'exposait, donc illisibles y compris pour nous.
#
# L'endpoint decrit l'API route par route : il ne sort pas du reseau interne. Traefik
# ne publie que ce qu'il route, et /actuator n'y figure pas.
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,prometheus}
management.endpoint.health.show-details=never

# Les percentiles se calculent dans l'application : trois series par minuteur, au lieu
# des dizaines qu'un histogramme complet produirait. C'est la ligne qui decide si la
# supervision coute quelques megaoctets par jour ou quelques centaines.
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=false

# Le code qui fait sauter la file d'attente. Vide, le raccourci n'existe pas.
# Il n'authentifie personne : le franchir, c'est arriver devant Keycloak comme tout le monde.
app.auth-gate.fast-pass-code=${APP_AUTH_GATE_FAST_PASS_CODE:}
# Explicit bridge for the documented environment variable (prefix contains a hyphen).
app.auth-gate.secret=${APP_AUTH_GATE_SECRET:insastronaute-auth-gate-hmac-sha256-default-secret-key-32bytes}
